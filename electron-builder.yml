appId: com.kangfenmao.CherryStudio
productName: Re_Cherry
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Re_Cherry
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!.*"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!patches"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!docs"
  - "!tools"
  - "!packages"
  - "!._*"
  - "!*.log"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
asarUnpack:
  - out/proxy/**
  - resources/**
  - "**/*.{metal,exp,lib}"
  # LocalPaddle（文档处理通道 local-paddle）原生闭包显式解包（v0.4.4）：
  # .node 绑定 + 同目录 DLL 必须成组落在 app.asar.unpacked（Windows 无法从
  # asar 加载 DLL；onnxruntime_binding.node 静态依赖同目录 onnxruntime.dll，
  # sharp 同理）——v0.4.3 及之前 @img/sharp-win32-x64 整包缺失（pnpm 收集器
  # 对顶层可解析包的 optionalDependencies 存在性校验看不见 .pnpm 虚拟存储，
  # 静默丢弃），安装版 OCR 必死；scripts/after-pack.js 对此有交付断言。
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/ppu-ocv/**"
  - "**/node_modules/ppu-paddle-ocr/**"
  # @napi-rs/canvas（pdfjs 补 DOMMatrix/Path2D/ImageData 全局的载体；pdf-parse 的正式依赖，
  # 其平台包是它的 optionalDependencies——与 @img/sharp 同一个"pnpm 收集器静默丢弃"坑面）：
  # 运行时由 pdf.js 与两条 OCR 光栅化腿按字面 require 加载 .node，必须落在 app.asar.unpacked。
  # scripts/after-pack.js 对此有交付断言（v1：读 PDF 与 OCR 共用同一份在场保证）。
  - "**/node_modules/@napi-rs/**"

win:
  executableName: Re_Cherry
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Re_Cherry
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Re_Cherry 1.0.1 - Code highlighting and tool installation fixes

    This round closes two clusters of user-reported defects: streaming code blocks that rendered
    duplicated or lost their colors, and Code CLI tools that reported "broken or outdated
    installation" although they had just installed.

    🎨 Code highlighting
    - A code block no longer renders twice without colors when the highlight worker fails on a
      language: the worker reports the failure and the main thread takes over with the full
      grammar engine.
    - A failed incremental highlight no longer wipes the already-highlighted state (which could
      leave a block permanently monochrome when the stream had just ended). The hook follows the
      upstream v2 implementation: keep the last good state, let the error propagate, retry on the
      next delta.
    - `highlightCode` passes the actually loaded language and theme to Shiki, so a degraded
      language no longer throws inside `codeToHtml`.
    - Markdown fences with unknown languages render as plain text instead of being mis-colored by
      the JSON grammar.

    🛠️ Code CLI tools
    - The install pipeline verifies that the freshly written binary actually launches (probe
      capped at 90 s), and the progress UI shows the new launch step.
    - When a probe or a launch fails, the error carries the concrete diagnostics instead of a
      generic "broken or outdated installation".
    - Fixed npm bin resolution on Windows: the real JS entry behind `.cmd` shims is resolved
      before probing, and the managed Node directories are prepended to PATH with a cache
      invalidation after an install, so a freshly installed tool is found immediately.

    <!--LANG:zh-CN-->
    Re_Cherry 1.0.1 —— 代码高亮与工具安装修复

    本轮收掉两批用户上报的缺陷：流式代码块渲染成两份或丢光颜色；代码助手工具刚装完却报
    "broken or outdated installation"。

    🎨 代码高亮
    - 高亮 worker 对某语言失败时，代码块不再渲染成两份无色文本：worker 如实上抛，主线程用
      完整语法引擎接管。
    - 增量高亮失败不再清空已高亮的状态（此前若失败恰逢流结束，整块会永久单色）。hook 采用
      上游 v2 实现：保留最后一次的正确结果、错误上抛、下一次增量自然重试。
    - `highlightCode` 把实际加载成功的语言与主题传给 Shiki，语言降级后不再在 `codeToHtml`
      内抛错。
    - 未知语言的围栏按纯文本渲染，不再被 JSON 语法错误上色。

    🛠️ 代码助手工具
    - 安装管线在写入后验证可执行文件真的能启动（探测上限 90 秒），进度界面新增启动步骤。
    - 探测或启动失败时，错误信息带上具体诊断，不再只报笼统的 "broken or outdated
      installation"。
    - 修复 Windows 上的 npm bin 解析：先解析 `.cmd` shim 背后的真实 JS 入口再探测；安装后把
      受管 Node 目录前置进 PATH 并失效缓存，新装工具立即可用。

    <!--LANG:en-->
    Re_Cherry 1.0.0 - the first release

    Re_Cherry 1.0.0 finishes what the plan asked for: the internal documents, the cleanup of the
    development leftovers, and the release itself. It also brings back an update channel that this
    fork removed in 0.2.1 - this time a self-contained one, built on this repository's own releases.
    Every fix of the 0.5.x rounds is included as well; those blocks follow below.

    🔄 Updates
    - The app checks this repository's releases, downloads the installer, verifies it and starts it. A prompt appears in the top bar (in the left sidebar when the sidebar layout is active) as soon as a version is available.
    - Settings → About holds the manual check, the download progress, the checksum result, the install action and the ignore action.
    - The checksum comes from the release asset (sha256). When the source gives no checksum, the app reports the download as unverified instead of claiming a verified one.
    - A portable build cannot replace itself. It reports the new version and links to the release page.
    - Nothing downloads on its own. The switch in About turns that on; by default the download starts when you ask for it.
    - The release-notes page in About reads this repository now. It used to read the upstream repository.

    📚 Documents
    - CLAUDE.md describes the current structure only. Decision logs, version history and references to documents outside the repository are gone.
    - Seven documents under docs/ cover the architecture, the kernel seams, the data layout, the IPC contract, the quality gates, the release process and the known limits.

    🧹 Cleanup
    - Comments no longer restate the development rules or cite an audit round. Those rules have one home now.
    - The development tools live in the repository under tools/. The installer ships neither tools/ nor docs/.
    - Build output, TypeScript build info, a stale audit-closure script and the notes of an old round are gone.

    <!--LANG:zh-CN-->
    Re_Cherry 1.0.0 —— 正式版

    1.0.0 收尾了规划里的三件事：编制内部文档、清理开发遗产、正式上线。同时把 0.2.1 移除的更新通道
    接了回来——这次是自研的，直接读本仓自己的发布。0.5.x 各轮的修复也都在，对应块在下面。

    🔄 应用内更新
    - 应用自己查本仓的发布、下载安装包、校验摘要并拉起安装器。发现有新版本时，顶栏会出现提示（左侧导航布局下落在侧栏底部）。
    - 设置 → 关于里集中放：手动检查、下载进度、摘要校验结论、安装、忽略此版本。
    - 摘要来自发布资产自带的 sha256。源没给摘要时，应用会如实标成"未校验"，不谎报已校验。
    - 便携版不能自替换：它只报出新版本，并给出发布页入口。
    - 不会自己下载。自动下载由关于页的开关控制；默认是你点了才开始。
    - 关于页的"更新日志"页现在读本仓的发布，此前读的是上游仓库。

    📚 内部文档
    - CLAUDE.md 只描述当前结构：决策日志、版本史诗、以及指向仓外文档的引用都去掉了。
    - docs/ 下 7 份文档分别说明架构、内核缝、数据布局、IPC 契约、质量门禁、发布流程与已知限制。

    🧹 清理
    - 注释不再复述开发规定、也不再引用审计轮次；规定只有一处出处。
    - 开发工具收进仓库的 tools/；安装包既不带 tools/ 也不带 docs/。
    - 构建产物、TypeScript 构建信息、失效的审计闭环脚本、上一轮的笔记都已删除。

    <!--LANG:en-->
    Re_Cherry 0.5.3 - Fixes after the 0.5.2 cleanup round

    This round closes one boot-path defect and four defects that users reported.

    🛡️ Safety and correctness
    - The boot sequence runs once per process. An inlined copy of `electron-store` deleted the entry module from the Node module cache, so every chunk that required the entry re-ran the whole boot: duplicate IPC handlers, a failed kernel boot, and two loggers on one file. The package now stays external, and the build fails if any bundle touches `require.cache`.
    - The pause key cuts work in progress. Main aborts its own long work for the topic, and a new `llm/stream` middleware cancels the in-flight model request. The reply stops at the key press, not at the next turn boundary.
    - The PDF text layer reads in the shared extractor engine: one pass, in the same process as the other formats. The utility subprocess, its build entry, its packaging assertion and the unused `pdf:extractText` IPC channel are gone. Root cause of the old `DOMMatrix is not defined` failure: pdf.js treats an Electron utility process as a non-Node environment and skips its own DOM polyfill.
    - Knowledge-base citations merge into one carrier, as web-search citations already did. Two searches in one turn no longer produce two carriers with two numbering sets, and reopening a topic no longer splits them again.
    - The Skills page loads. It scans on mount now. The scan was never triggered before, so the page spun forever.
    - The install progress of a Code CLI tool survives a page switch and a reload. Main owns the running operation and reports it in the tool snapshot.
    - The launchpad keeps pinned miniapp tiles at the left. The grid no longer collapses empty tracks, so a short row no longer spreads across the full width.

    ⚡ Performance
    - The vision document path sends JPEG page images: 1521 KB to 286 KB per page (-81%).
    - A 178 MB, 530-page PDF reads its text layer in 116 ms.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.3 —— 0.5.2 整理轮之后的修复

    本轮修掉启动链路上一个缺陷，以及四项用户上报的缺陷。

    🛡️ 安全与正确性
    - 启动序列每个进程只跑一次。被内联进产物的 `electron-store` 把自己的入口模块从 Node 模块缓存里删掉，于是每个「回指入口」的 chunk 都让整份入口重跑：IPC 重复注册、内核启动失败、两个 logger 抢同一日志文件。该包现在保持 external；任何产物只要改写 `require.cache`，构建即失败。
    - 暂停键能掐断在途工作。主进程中止该话题下自己的长活，新的 `llm/stream` 中间件取消在途的模型请求——回答在按键当刻停住，不再等下一个回合边界。
    - PDF 文本层回到共用抽取引擎：一次读完，与其他格式同进程。独立子进程、它的构建入口、打包断言，以及那条无人调用的 `pdf:extractText` 通道全部删除。旧报错 `DOMMatrix is not defined` 的根因：pdf.js 把 Electron 的 utility 进程判定为「非 Node 环境」，从而跳过它自己的 DOM 补丁。
    - 知识库引用与网络搜索一样合并进同一个载体。同一轮两次检索不再产生两个载体、两套编号；重开话题也不再重新裂开。
    - 技能页能正常加载：进入页面即扫描。此前从未触发扫描，于是永久转圈。
    - 代码助手的安装进度在切页与整页刷新后仍在：主进程持有进行中的操作，并随工具快照下发。
    - 启动台的固定小程序磁贴保持在左侧：网格不再折叠空轨道，短行不再被摊开到整行宽度。

    ⚡ 性能
    - 视觉文档通道改发 JPEG 页图：每页 1521 KB 降到 286 KB（−81%）。
    - 178 MB / 530 页的 PDF，文本层读取 116 毫秒。

    <!--LANG:en-->
    Re_Cherry 0.5.2 - Pre-release cleanup, round 3

    The second full review produced 337 findings. Every finding now carries one terminal status.

    🛡️ Safety and correctness
    - The message-delete path reports a partial erasure. It no longer hides a failed disk delete.
    - The trace window subscribes to the language once. A reload no longer stacks duplicate sends.
    - The rich-editor toolbar keeps a stable hook order. It no longer breaks when the editor attaches late.
    - The notes editor keeps one save timer. A rename or a move no longer revives the old file path.
    - The knowledge-base search reports a failure as a failure. It no longer shows an empty list.
    - The Hermes dashboard start has no unreachable cancellation branch.
    - Dead surfaces are gone: the API-gateway lease trio, the always-false lifecycle flag, and one unused helper.

    ⚡ Performance
    - Each message block and each code block subscribes to its own settings fields. A settings change no longer re-renders the whole message tree.
    - One Shiki language chunk per language. The duplicate set is gone (-4.14 MB, 309 files).
    - The first paint no longer runs the Notion client or the OpenTelemetry web trace.
    - First-paint payload: 12.782 MB to 12.368 MB.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.2 - 正式版前的第三轮整理

    第二轮全量审查共 337 条发现，现已逐条给出终局结论（修复 / 复核不成立 / 有意保留）。

    🛡️ 安全与正确性
    - 消息删除路径会如实报告「部分数据仍在磁盘上」，不再把落盘失败藏起来。
    - trace 窗口的语言订阅只挂一次；重新加载不再叠加重复推送。
    - 富文本工具栏的 Hook 顺序固定，编辑器晚到时不再崩。
    - 笔记编辑器只保留一个保存定时器；改名或移动后不会按旧路径把文件复活。
    - 知识库检索把失败如实报为失败，不再显示成「没有结果」。
    - Hermes 面板启动路径里不可达的取消分支已删除。
    - 清理死表面：API 网关的租约三件套、恒 false 的生命周期字段、一个零调用的工具函数。

    ⚡ 性能
    - 每个消息块与代码块只订阅自己用到的设置字段；改一次设置不再重渲染整棵消息树。
    - 每种语言只留一份 Shiki chunk，重复副本消除（-4.14 MB，309 个文件）。
    - 首屏不再执行 Notion 客户端与 OpenTelemetry web trace。
    - 首屏载荷 12.782 MB → 12.368 MB。

    <!--LANG:en-->
    Re_Cherry 0.5.1 - Pre-release cleanup, round 2

    A second full review produced 336 findings. This release fixes the open high-severity items.

    🛡️ Safety and correctness
    - The session sweep no longer deletes a session that exists but cannot be read.
    - The backup restore moves the old directory aside first. A failed restore keeps the backup.
    - Four tools report a total source failure as a failure, not as "no results".
    - The web-search source update keeps the sources you did not select.
    - The health check no longer shows a total failure as "0/N passed".
    - A programmatic edit in the notes editor no longer gets discarded or silently reverted.
    - The MCP server command is validated before spawn. Bare names like node and python resolve correctly.

    ⚡ Performance
    - Stable-prefix streaming: the Markdown pipeline runs twice per reply instead of once per frame.
    - The reply text writes to Redux as a delta, not as the whole text.
    - The Notion export loads on demand.
    - First-paint payload: 12.502 MB to 12.184 MB.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.1 - 正式版前的第二轮整理

    第二轮全量审查产出 336 条发现，本版修复其中的高严重度未闭环项。

    🛡️ 安全与正确性
    - 启动清扫不再物理删除「存在但读不出来」的会话。
    - 备份还原改为先把旧目录挪开；还原失败保留备份。
    - 四个工具把「数据源全部失败」如实报为失败，不再说成「没有结果」。
    - 更新搜索订阅源时，未选中的订阅源不再丢失。
    - 健康检查不再把整体失败显示成「0/N 通过」。
    - 笔记编辑器的程序化写入不再被丢弃或被静默还原。
    - MCP 服务器命令在 spawn 前校验；node、python 这类裸名现在能正确解析。

    ⚡ 性能
    - 流式稳定前缀复用：Markdown 管线每次回复只跑 2 次，而非每帧 1 次。
    - 正文写 Redux 改为增量，不再每帧写全文。
    - Notion 导出改为按需加载。
    - 首屏载荷 12.502 MB → 12.184 MB。

    <!--LANG:en-->
    Re_Cherry 0.5.0 - Pre-release cleanup, round 1

    Full code review, performance work and cleanup before the official release.

    ⚡ Performance
    - Route-level code splitting: first-paint JS payload dropped from 21.3 MB to 14.1 MB (-33%).
    - MathJax loads only when the MathJax math engine is selected (KaTeX is the default).
    - Removed a bundle leak that pulled the PDF-parsing stack into the renderer; Excel export now loads on demand.
    - The trace window no longer polls the DOM 10 times per second.

    🐛 Fixes
    - In-place translation could create a duplicate translation block after a restart.
    - Obsidian export used a stale topic name after renaming a topic.
    - The MCP dependency page always reported "missing dependencies"; it now reports the real PATH status of npx/uvx.

    🧹 Cleanup
    - 257 unused translation keys removed; lint warnings across the repository reduced to zero.

    <!--LANG:zh-CN-->
    Re_Cherry 0.5.0 - 正式版前的第一轮整理

    正式上线前的全量代码审查、性能优化与清理。

    ⚡ 性能
    - 路由级代码分割：首屏 JS 载荷由 21.3MB 降至 14.1MB（-33%）。
    - MathJax 仅在选择 MathJax 数学引擎时加载（默认引擎为 KaTeX）。
    - 修复把 PDF 解析栈拖入渲染层的打包泄漏；Excel 导出改为按需加载。
    - trace 窗不再以每秒 10 次的频率轮询 DOM。

    🐛 修复
    - 消息级翻译在重启后可能重复创建翻译块。
    - 话题改名后导出到 Obsidian 仍使用旧名。
